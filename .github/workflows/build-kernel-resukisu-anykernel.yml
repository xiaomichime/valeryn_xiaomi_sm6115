name: Build Kernel with ReSukiSU (AnyKernel3)
on:
  workflow_dispatch:

env:
  KERNEL_NAME: Valeryn-KSU
  DEVICE_NAME: chime

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev \
            libncurses5-dev device-tree-compiler python3 zip unzip git patch ccache \
            lld llvm clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu perl

      - name: Setup Proton Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/toolchains/clang

          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$HOME/toolchains/clang" >> $GITHUB_ENV
          echo "LLVM=$HOME/toolchains/clang" >> $GITHUB_ENV

      - name: Clone ReSukiSU
        run: git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU

      - name: Integrate ReSukiSU
        run: |
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Fix menu.c for existing SUSFS modifications
        run: |
          MENU_C="drivers/cpuidle/governors/menu.c"

          if grep -q "last_state_idx" "$MENU_C" 2>/dev/null; then
            echo "Found SUSFS modifications in menu.c"

            # Check if struct already has the member
            if ! grep -B20 "last_state_idx = idx" "$MENU_C" | grep -q "int last_state_idx"; then
              echo "Adding missing 'int last_state_idx;' to struct menu_device..."

              # Find struct menu_device and add the member before closing brace
              awk '
              /struct menu_device \{/ { in_struct=1 }
              in_struct && /^\};/ {
                  print "\tint last_state_idx;"
                  in_struct=0
              }
              { print }
              ' "$MENU_C" > "$MENU_C.tmp" && mv "$MENU_C.tmp" "$MENU_C"

              echo "Fix applied!"
              grep -A3 "struct menu_device" "$MENU_C" | head -10
            else
              echo "Struct already has last_state_idx member"
            fi
          else
            echo "No SUSFS modifications found in menu.c - skipping fix"
          fi

      - name: Fix TASKS_TRACE_RCU Kconfig
        run: |
          # Change def_bool 0 to def_bool y so CONFIG_TASKS_TRACE_RCU can be enabled
          sed -i 's/def_bool 0/def_bool y/' kernel/rcu/Kconfig
          echo "Fixed TASKS_TRACE_RCU in Kconfig:"
          grep -A2 "config TASKS_TRACE_RCU" kernel/rcu/Kconfig

      - name: Fix BPF sysctl missing ifdef guard
        run: |
          # The bpf_stats_enabled entry in kernel/sysctl.c references bpf_stats_handler
          # which is wrapped in #ifdef CONFIG_BPF_SYSCALL, but the table entry itself is not.
          # This causes build errors when BPF is disabled.

          # Use perl for multiline replacement - add ifdef guards around bpf_stats_enabled entry
          perl -i -0pe 's/(\t\{\n\t\t\.procname\t= "bpf_stats_enabled",.*?\n\t\},)/#ifdef CONFIG_BPF_SYSCALL\n$1\n#endif/s' kernel/sysctl.c

          echo "Fixed bpf_stats_enabled sysctl entry:"
          grep -B2 -A10 "bpf_stats_enabled" kernel/sysctl.c | head -20

      - name: Configure kernel for Non-GKI
        run: |
          make ARCH=arm64 O=out chime-stock_defconfig

          cat >> out/.config << 'EOF'

          #
          # KernelSU Configuration for Non-GKI (4.19)
          #
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPROBES=y

          #
          # Disable BPF (fixes undefined GKI vendor hooks in non-GKI kernel)
          #
          # CONFIG_BPF is not set
          # CONFIG_BPF_SYSCALL is not set
          # CONFIG_BPF_JIT is not set
          # CONFIG_BPF_JIT_ALWAYS_ON is not set
          # CONFIG_BPF_EVENTS is not set

          #
          # RCU Tasks Trace (fixes trc_reader_need_end error)
          #
          CONFIG_TASKS_TRACE_RCU=y
          EOF

          make ARCH=arm64 O=out olddefconfig

          # Create vendor directory for config_data.gz
          mkdir -p arch/arm64/configs/vendor
          cp out/.config arch/arm64/configs/vendor/chime-stock_defconfig

          echo "=== Final KSU Configuration ==="
          grep -E "CONFIG_KSU|CONFIG_KPM" out/.config

          echo "=== BPF Status (should be disabled) ==="
          grep -E "CONFIG_BPF" out/.config || echo "BPF disabled"

          echo "=== TASKS_TRACE_RCU Status (should be enabled) ==="
          grep "CONFIG_TASKS_TRACE_RCU" out/.config

      - name: Build kernel
        run: |
          export PATH="$HOME/toolchains/clang/bin:$PATH"

          # Build without LLVM=1 to avoid VDSO linker issues
          # Use explicit cross-compiler settings
          make -j$(nproc) \
            ARCH=arm64 \
            O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=aarch64-linux-gnu-ld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            2>&1 | tee build.log

      - name: Check build result
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Kernel built successfully!"
            ls -la out/arch/arm64/boot/Image.gz
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Kernel built successfully (uncompressed)!"
            ls -la out/arch/arm64/boot/Image
          else
            echo "Kernel build failed. Checking for errors..."
            tail -n 100 build.log
            exit 1
          fi

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # Remove example kernel files
          rm -f AnyKernel3/Image.gz-dtb AnyKernel3/zImage AnyKernel3/Image AnyKernel3/Image.gz

      - name: Prepare AnyKernel3
        run: |
          # Copy kernel to AnyKernel3
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            echo "KERNEL_TYPE=Image.gz" >> $GITHUB_ENV
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
            echo "KERNEL_TYPE=Image" >> $GITHUB_ENV
          fi

          # Copy kernel modules if any
          mkdir -p AnyKernel3/modules
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/ \; 2>/dev/null || true

          # Create custom anykernel3.sh with device support
          cat > AnyKernel3/anykernel3.sh << 'AKSCRIPT'
          ## AnyKernel3 (https://github.com/osm0sis/AnyKernel3)
          ## Modified for Xiaomi SM6115 (chime/citrus/lime)

          # kernel string properties
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanuponabort=1

          # device name & model verification
          # Add all supported device codenames here
          device.name1=chime
          device.name2=citrus
          device.name3=lime
          device.name4=blossom
          device.name5=sunny
          device.name6=star
          device.name7=lemon

          # AnyKernel3 props
          block=auto;

          # boot partition path (auto-detect)
          # Will use /dev/block/by-name/boot or /dev/block/bootdevice/by-name/boot

          # init.*.rc replacement string
          init.d=;

          ## end anykernel setup

          ## AnyKernel3 permissions
          set_perm_recursive $home 0 0 755 644
          set_perm_recursive $home/bin 0 0 755 755

          ## AnyKernel3 functions
          for f in $home/tools/$arch/*; do
            chmod 755 $f
          done

          ## AnyKernel3 kernel unpack/repack
          dump_boot() {
            # Standard boot image unpack
            $home/tools/$arch/unpackbootimg -i $block -o $home
          }

          write_boot() {
            # Repack with new kernel
            $home/tools/$arch/mkbootimg \
              --kernel $home/Image.gz \
              --ramdisk $home/ramdisk.cpio.gz \
              --cmdline "$(cat $home/cmdline)" \
              --base $(cat $home/base) \
              --pagesize $(cat $home/pagesize) \
              --kernel_offset $(cat $home/kernel_offset) \
              --ramdisk_offset $(cat $home/ramdisk_offset) \
              --tags_offset $(cat $home/tags_offset) \
              --os_version $(cat $home/os_version 2>/dev/null || echo "11.0.0") \
              --os_patch_level $(cat $home/os_patch_level 2>/dev/null || echo "2024-01") \
              -o $home/newboot.img

            cat $home/newboot.img /dev/zero > $block 2>/dev/null || true
          }
          AKSCRIPT

          # Make script executable
          chmod 755 AnyKernel3/anykernel3.sh

          echo "=== AnyKernel3 prepared ==="
          ls -la AnyKernel3/

      - name: Create flashable zip
        run: |
          cd AnyKernel3

          # Create the flashable zip
          zip -r9 ../${{ env.KERNEL_NAME }}-AnyKernel3.zip *

          cd ..

          echo "=== Flashable zip created ==="
          ls -la ${{ env.KERNEL_NAME }}-AnyKernel3.zip

          # Also create kernel artifacts
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true

          find out -name "*.ko" -exec cp {} artifacts/ \; 2>/dev/null || true

          echo "Kernel: ${{ env.KERNEL_NAME }}" > artifacts/info.txt
          echo "Build Date: $(date)" >> artifacts/info.txt
          echo "Kernel Type: Non-GKI (4.19)" >> artifacts/info.txt
          echo "Hook Type: MANUAL_HOOK" >> artifacts/info.txt
          echo "Flashable: Yes (AnyKernel3)" >> artifacts/info.txt
          cat out/.config | grep -E "CONFIG_KSU|CONFIG_KPM" >> artifacts/info.txt 2>/dev/null || true

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-AnyKernel3
          path: ${{ env.KERNEL_NAME }}-AnyKernel3.zip
          retention-days: 30

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-kernel
          path: artifacts/*
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
