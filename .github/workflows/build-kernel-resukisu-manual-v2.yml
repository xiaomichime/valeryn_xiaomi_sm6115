name: Build Kernel with ReSukiSU (Manual Hook)
on:
  workflow_dispatch:

env:
  KERNEL_NAME: Valeryn-KSU

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev \
            libncurses5-dev device-tree-compiler python3 zip unzip git patch ccache \
            lld llvm clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/toolchains/clang
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$HOME/toolchains/clang" >> $GITHUB_ENV
          echo "LLVM=$HOME/toolchains/clang" >> $GITHUB_ENV

      - name: Clone ReSukiSU
        run: git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU

      - name: Integrate ReSukiSU
        run: |
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Patch kernel for ReSukiSU manual hooks
        run: |
          echo "=== Patching fs/exec.c ==="
          # Add extern declaration at the top
          sed -i '1i\#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif' fs/exec.c
          
          # Find do_execveat_common and add hook call
          # This adds the hook right after the function opening brace
          sed -i '/static int do_execveat_common(/,/^{$/s/^{$/{\n#ifdef CONFIG_KSU\n    ksu_handle_execveat(\&fd, \&filename, (void *)__argv, (void *)__envp, \&flags);\n#endif/' fs/exec.c 2>/dev/null || true
          
          # Alternative: try for __do_execve_file if do_execveat_common not found
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            sed -i '/static int __do_execve_file(/,/^{$/s/^{$/{\n#ifdef CONFIG_KSU\n    ksu_handle_execveat(\&fd, \&filename, (void *)__argv, (void *)__envp, \&flags);\n#endif/' fs/exec.c 2>/dev/null || true
          fi

          echo "=== Patching fs/open.c ==="
          sed -i '1i\#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *__unused_flags);\n#endif' fs/open.c
          
          # Patch SYSCALL_DEFINE4(faccessat
          sed -i '/SYSCALL_DEFINE4(faccessat/,/^{$/s/^{$/{\n#ifdef CONFIG_KSU\n    ksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n#endif/' fs/open.c 2>/dev/null || true
          
          # Also try SYSCALL_DEFINE3 if 4 not found
          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            sed -i '/SYSCALL_DEFINE3(faccessat/,/^{$/s/^{$/{\n#ifdef CONFIG_KSU\n    ksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n#endif/' fs/open.c 2>/dev/null || true
          fi

          echo "=== Patching fs/stat.c ==="
          sed -i '1i\#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif' fs/stat.c
          
          # Patch vfs_statx
          sed -i '/int vfs_statx(/,/^{$/s/^{$/{\n#ifdef CONFIG_KSU\n    ksu_handle_stat(\&dfd, \&filename, \&flags);\n#endif/' fs/stat.c 2>/dev/null || true
          
          # Alternative: try __do_statx
          if ! grep -q "ksu_handle_stat" fs/stat.c; then
            sed -i '/static int __do_statx(/,/^{$/s/^{$/{\n#ifdef CONFIG_KSU\n    ksu_handle_stat(\&dfd, \&filename, \&flags);\n#endif/' fs/stat.c 2>/dev/null || true
          fi
          
          # Alternative: try vfs_fstatat
          if ! grep -q "ksu_handle_stat" fs/stat.c; then
            sed -i '/int vfs_fstatat(/,/^{$/s/^{$/{\n#ifdef CONFIG_KSU\n    ksu_handle_stat(\&dfd, \&filename, \&flags);\n#endif/' fs/stat.c 2>/dev/null || true
          fi

          echo "=== Verification ==="
          echo "fs/exec.c:"
          grep -c "ksu_handle_execveat" fs/exec.c || echo "NOT FOUND"
          echo "fs/open.c:"
          grep -c "ksu_handle_faccessat" fs/open.c || echo "NOT FOUND"
          echo "fs/stat.c:"
          grep -c "ksu_handle_stat" fs/stat.c || echo "NOT FOUND"

      - name: Fix menu.c if needed
        run: |
          MENU_C="drivers/cpuidle/governors/menu.c"
          if grep -q "last_state_idx" "$MENU_C" 2>/dev/null; then
            if ! grep -B20 "last_state_idx = idx" "$MENU_C" | grep -q "int last_state_idx"; then
              awk '/struct menu_device \{/{in_struct=1} in_struct&&/^\};/{print "\tint last_state_idx;";in_struct=0}{print}' "$MENU_C" > "$MENU_C.tmp" && mv "$MENU_C.tmp" "$MENU_C"
            fi
          fi

      - name: Configure kernel for Non-GKI
        run: |
          make ARCH=arm64 O=out chime-stock_defconfig

          cat >> out/.config << 'EOF'

          #
          # KernelSU Configuration for Non-GKI (4.19) - Manual Hook
          #
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPROBES=y
          EOF

          make ARCH=arm64 O=out olddefconfig

          mkdir -p arch/arm64/configs/vendor
          cp out/.config arch/arm64/configs/vendor/chime-stock_defconfig 2>/dev/null || true

          echo "=== Final KSU Configuration ==="
          grep -E "CONFIG_KSU|CONFIG_KPM" out/.config

      - name: Build kernel
        run: |
          export PATH="$HOME/toolchains/clang/bin:$PATH"
          make -j$(nproc) ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 2>&1 | tee build.log

      - name: Check build result
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "SUCCESS!"
            ls -la out/arch/arm64/boot/Image.gz
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "SUCCESS (uncompressed)!"
            ls -la out/arch/arm64/boot/Image
          else
            tail -n 100 build.log
            exit 1
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          find out -name "*.ko" -exec cp {} artifacts/ \; 2>/dev/null || true
          echo "Kernel: ${{ env.KERNEL_NAME }}" > artifacts/info.txt
          echo "Build Date: $(date)" >> artifacts/info.txt
          echo "Hook Type: MANUAL_HOOK" >> artifacts/info.txt
          cat out/.config | grep -E "CONFIG_KSU|CONFIG_KPM" >> artifacts/info.txt 2>/dev/null || true
          ls -la artifacts/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-kernel
          path: artifacts/*
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
