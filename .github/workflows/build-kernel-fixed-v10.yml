name: Build Kernel with ReSukiSU (Manual Hook Mode)
on:
  workflow_dispatch:

env:
  KERNEL_NAME: Valeryn-KSU

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev \
            libncurses5-dev device-tree-compiler python3 zip unzip git patch ccache \
            lld llvm clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/toolchains/clang

          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$HOME/toolchains/clang" >> $GITHUB_ENV
          echo "LLVM=$HOME/toolchains/clang" >> $GITHUB_ENV

      - name: Clone ReSukiSU
        run: git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU

      - name: Integrate ReSukiSU
        run: |
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Fix menu.c if needed
        run: |
          # Fix for partial SUSFS modifications in kernel source
          MENU_C="drivers/cpuidle/governors/menu.c"

          if grep -q "last_state_idx" "$MENU_C" 2>/dev/null; then
            echo "Found SUSFS modifications in menu.c"
            if ! grep -B20 "last_state_idx = idx" "$MENU_C" | grep -q "int last_state_idx"; then
              echo "Adding missing 'int last_state_idx;' to struct menu_device..."
              awk '
              /struct menu_device \{/ { in_struct=1 }
              in_struct && /^\};/ { print "\tint last_state_idx;"; in_struct=0 }
              { print }
              ' "$MENU_C" > "$MENU_C.tmp" && mv "$MENU_C.tmp" "$MENU_C"
              echo "Fix applied!"
            fi
          fi

      - name: Configure kernel for Non-GKI with MANUAL_HOOK
        run: |
          make ARCH=arm64 O=out chime-stock_defconfig

          # ============================================================================
          # For Non-GKI kernel 4.19, we use CONFIG_KSU_MANUAL_HOOK instead of SUSFS
          # because ReSukiSU's SUSFS support requires a newer SUSFS API than
          # what simonpunk's kernel-4.19 branch provides.
          #
          # MANUAL_HOOK mode works by:
          # 1. LSM hooks for setuid and initrc (auto-enabled by default)
          # 2. Works on Non-GKI kernels without tracepoint support
          # ============================================================================

          cat >> out/.config << 'EOF'

          #
          # KernelSU Configuration for Non-GKI (4.19) - Manual Hook Mode
          #
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPROBES=y
          EOF

          make ARCH=arm64 O=out olddefconfig

          # Fix: Create vendor directory for config_data.gz
          mkdir -p arch/arm64/configs/vendor
          cp out/.config arch/arm64/configs/vendor/chime-stock_defconfig 2>/dev/null || true

          echo "=== Final KSU Configuration ==="
          grep -E "CONFIG_KSU|CONFIG_KPM" out/.config || echo "No KSU configs found!"

      - name: Build kernel
        run: |
          export PATH="$HOME/toolchains/clang/bin:$PATH"

          make -j$(nproc) \
            ARCH=arm64 \
            O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            2>&1 | tee build.log

      - name: Check build result
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Kernel built successfully!"
            ls -la out/arch/arm64/boot/Image.gz
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Kernel built successfully (uncompressed)!"
            ls -la out/arch/arm64/boot/Image
          else
            echo "Kernel build may have failed. Checking for errors..."
            tail -n 100 build.log
            exit 1
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true

          find out -name "*.ko" -exec cp {} artifacts/ \; 2>/dev/null || true

          echo "Kernel: ${{ env.KERNEL_NAME }}" > artifacts/info.txt
          echo "Build Date: $(date)" >> artifacts/info.txt
          echo "Kernel Type: Non-GKI (4.19)" >> artifacts/info.txt
          echo "Hook Type: MANUAL_HOOK (LSM-based)" >> artifacts/info.txt
          cat out/.config | grep -E "CONFIG_KSU|CONFIG_KPM" >> artifacts/info.txt 2>/dev/null || true

          ls -la artifacts/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-kernel
          path: artifacts/*
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
