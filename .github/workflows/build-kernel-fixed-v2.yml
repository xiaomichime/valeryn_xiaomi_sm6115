name: Build Kernel with ReSukiSU and SUSFS
on:
  workflow_dispatch:

env:
  KERNEL_NAME: Valeryn-KSU

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev \
            libncurses5-dev device-tree-compiler python3 zip unzip git patch ccache \
            lld llvm clang

      - name: Setup Proton Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/toolchains/clang

          # Add both clang and bin to PATH
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH

          # Set environment variables
          echo "CLANG_PATH=$HOME/toolchains/clang" >> $GITHUB_ENV
          echo "LLVM=$HOME/toolchains/clang" >> $GITHUB_ENV

          # Verify toolchain has needed tools
          ls -la $HOME/toolchains/clang/bin/ | grep -E "clang|llvm-objcopy|llvm-objdump|llvm-ar|llvm-nm"

      - name: Clone ReSukiSU
        run: git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU

      - name: Clone SUSFS
        run: |
          git clone --depth=1 --branch kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs || \
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs

      - name: Integrate ReSukiSU
        run: |
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Copy SUSFS source files
        run: |
          mkdir -p include/linux fs
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/ || true
          cp susfs/kernel_patches/include/linux/susfs_def.h include/linux/ || true
          cp susfs/kernel_patches/include/linux/sus_su.h include/linux/ || true
          cp susfs/kernel_patches/fs/susfs.c fs/ || true
          cp susfs/kernel_patches/fs/sus_su.c fs/ || true
          ls -la include/linux/sus*.h fs/sus*.c

      - name: Apply SUSFS patches
        run: |
          PATCH="susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          if [ -f "$PATCH" ]; then
            for level in 1 0 2; do
              if patch -p${level} --dry-run < "$PATCH" 2>/dev/null; then
                patch -p${level} < "$PATCH" || echo "Patch applied with some failures - continuing..."
                echo "Patch applied at level ${level}"
                break
              fi
            done || echo "Patch application completed with some failures"
          else
            echo "Patch file not found, skipping"
          fi
          # Add SUSFS to fs/Makefile if not already present
          if ! grep -q "susfs" fs/Makefile; then
            sed -i '/^obj-y.*+=/a obj-y += susfs.o' fs/Makefile
          fi
        continue-on-error: true

      - name: Configure kernel
        run: |
          # Use chime-stock_defconfig as specified
          make ARCH=arm64 O=out chime-stock_defconfig

          # Verify KSU config is enabled
          grep -E "CONFIG_KSU|CONFIG_KPM" out/.config || echo "Checking KSU/KPM configs..."

      - name: Build kernel
        run: |
          # Set PATH to include LLVM tools
          export PATH="$HOME/toolchains/clang/bin:$PATH"

          # Use LLVM=1 to use LLVM tools (llvm-objcopy, llvm-ar, etc.)
          # This fixes the "Unable to recognise format" error with objcopy
          make -j$(nproc) \
            ARCH=arm64 \
            O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            2>&1 | tee build.log

      - name: Check build result
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Kernel built successfully!"
            ls -la out/arch/arm64/boot/Image.gz
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Kernel built successfully (uncompressed)!"
            ls -la out/arch/arm64/boot/Image
          else
            echo "Kernel build may have failed. Checking for errors..."
            tail -n 50 build.log
            exit 1
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true

          # Copy any kernel modules
          find out -name "*.ko" -exec cp {} artifacts/ \; 2>/dev/null || true

          # Create info file
          echo "Kernel: ${{ env.KERNEL_NAME }}" > artifacts/info.txt
          echo "Build Date: $(date)" >> artifacts/info.txt
          echo "ReSukiSU Version: $(cat KernelSU/kernel/Makefile | grep VERSION | head -n 1 || echo 'Unknown')" >> artifacts/info.txt || true

          ls -la artifacts/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-kernel
          path: artifacts/*
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
