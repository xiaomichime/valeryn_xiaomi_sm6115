name: Build ReSukiSU Kernel (Android 16)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: android16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm-dev python3 python3-setuptools libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Set up Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain

      - name: Integrate ReSukiSU
        run: |
          # Step A: Download ReSukiSU source code
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s nongki

      - name: Xiaomi 4.19 Smart-Fix
        run: |
          # 1. Fix include/linux/fs.h (Declarations)
          # Only add if not already present to avoid redefinition
          if ! grep -q "vfs_read_target" include/linux/fs.h; then
            sed -i '1i extern void *vfs_read_target;\nextern void *vfs_write_target;\nextern void *do_execve_target;' include/linux/fs.h
          fi

          # 2. Fix fs/read_write.c (Definitions)
          if ! grep -q "void *vfs_read_target =" fs/read_write.c; then
            echo 'void *vfs_read_target = NULL; EXPORT_SYMBOL(vfs_read_target);' >> fs/read_write.c
            echo 'void *vfs_write_target = NULL; EXPORT_SYMBOL(vfs_write_target);' >> fs/read_write.c
          fi

          # 3. Fix fs/exec.c (Definitions)
          if ! grep -q "void *do_execve_target =" fs/exec.c; then
            echo 'void *do_execve_target = NULL; EXPORT_SYMBOL(do_execve_target);' >> fs/exec.c
          fi

          # 4. Fix KPROBE_HIT_ACTIVE in drivers/kernelsu/kpm.c
          # Use a guard to prevent redefinition errors
          sed -i '1i #ifndef KPROBE_HIT_ACTIVE\n#define KPROBE_HIT_ACTIVE 1\n#endif' drivers/kernelsu/kpm.c

          # 5. Fix User Namespace in drivers/kernelsu/ksu.c
          if ! grep -q "user_namespace.h" drivers/kernelsu/ksu.c; then
            sed -i '1i #include <linux/user_namespace.h>' drivers/kernelsu/ksu.c
          fi

      - name: Build Kernel
        run: |
          TC_DIR=$(pwd)/toolchain/bin
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="Valeryn"
          export KBUILD_BUILD_HOST="Github-Actions"

          # Generate config
          make O=out ARCH=arm64 vendor/chime-stock_defconfig
          
          # Build process
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=$TC_DIR/clang \
                      LD=$TC_DIR/ld.lld \
                      AR=$TC_DIR/llvm-ar \
                      NM=$TC_DIR/llvm-nm \
                      OBJCOPY=$TC_DIR/llvm-objcopy \
                      OBJDUMP=$TC_DIR/llvm-objdump \
                      STRIP=$TC_DIR/llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      HOSTCC=gcc \
                      HOSTCXX=g++

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=chime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=citrus/' anykernel.sh
          zip -r ../ReSukiSU-Kernel-Chime.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-Chime
          path: ReSukiSU-Kernel-Chime.zip
