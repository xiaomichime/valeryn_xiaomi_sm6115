name: Build ReSukiSU Kernel (Android 16)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: android16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm-dev python3 python3-setuptools libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Set up Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain

      - name: Manual ReSukiSU Integration (Guaranteed Pathing)
        run: |
          # 1. Clean and Clone ReSukiSU
          rm -rf drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu --depth=1
          
          # 2. Fix the folder structure (Move everything from 'kernel' to root of drivers/kernelsu)
          if [ -d "drivers/kernelsu/kernel" ]; then
            cp -r drivers/kernelsu/kernel/* drivers/kernelsu/
          fi
          
          # 3. Inject ReSukiSU into the build system
          echo "obj-y += kernelsu/" >> drivers/Makefile
          # Add Kconfig source before the last 'endmenu' or at the end
          sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Ultimate Xiaomi 4.19 Fix (No Redefinitions)
        run: |
          # 1. Fix KPROBE_HIT_ACTIVE directly in the KPM source (Fixes your KPM error)
          # We check if the file exists first
          if [ -f drivers/kernelsu/kpm.c ]; then
            sed -i '1i #define KPROBE_HIT_ACTIVE 1' drivers/kernelsu/kpm.c
          fi

          # 2. Fix Namespace inclusion in KSU (Fixes init_user_ns error)
          if [ -f drivers/kernelsu/ksu.c ]; then
            sed -i '1i #include <linux/user_namespace.h>' drivers/kernelsu/ksu.c
          fi

          # 3. Create the Hooks manually in the core kernel files
          # We append these to the end to avoid conflicts with existing headers
          echo -e '\nvoid *vfs_read_target = NULL;\nEXPORT_SYMBOL(vfs_read_target);\nvoid *vfs_write_target = NULL;\nEXPORT_SYMBOL(vfs_write_target);' >> fs/read_write.c
          echo -e '\nvoid *do_execve_target = NULL;\nEXPORT_SYMBOL(do_execve_target);' >> fs/exec.c

      - name: Build Kernel
        run: |
          TC_DIR=$(pwd)/toolchain/bin
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="Valeryn"
          export KBUILD_BUILD_HOST="Github-Actions"

          # Step 1: Config
          make O=out ARCH=arm64 vendor/chime-stock_defconfig
          
          # Step 2: Build
          # We pass KCFLAGS to define the hooks globally for all files
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=$TC_DIR/clang \
                      LD=$TC_DIR/ld.lld \
                      AR=$TC_DIR/llvm-ar \
                      NM=$TC_DIR/llvm-nm \
                      OBJCOPY=$TC_DIR/llvm-objcopy \
                      OBJDUMP=$TC_DIR/llvm-objdump \
                      STRIP=$TC_DIR/llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      HOSTCC=gcc \
                      HOSTCXX=g++ \
                      KCFLAGS="-Dvfs_read_target=vfs_read_target -Dvfs_write_target=vfs_write_target -Ddo_execve_target=do_execve_target"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          [ -f out/arch/arm64/boot/Image.gz ] && cp out/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f out/arch/arm64/boot/Image ] && cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=chime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=citrus/' anykernel.sh
          zip -r ../ReSukiSU-Kernel-Chime.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-Chime
          path: ReSukiSU-Kernel-Chime.zip
