name: Build ReSukiSU Kernel (Android 16)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: android16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm-dev python3 python3-setuptools libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Set up Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain

      - name: Manual ReSukiSU Integration
        run: |
          # 1. Clone ReSukiSU
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu --depth=1
          
          # 2. Move kernel source files to the driver root
          mv drivers/kernelsu/kernel/* drivers/kernelsu/
          
          # 3. Add to the kernel build system
          if !<!--citation:1--> grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: Xiaomi 4.19 "Undeclared Identifier" Fix
        run: |
          # This specifically fixes the KPROBE_HIT_ACTIVE error from your logs
          
          # Fix KPM.c: Define the missing constant at the very top
          echo -e "#define KPROBE_HIT_ACTIVE 1\n$(cat drivers/kernelsu/kpm.c)" > drivers/kernelsu/kpm.c
          
          # Fix KSU.c: Add missing namespace header
          echo -e "#include <linux/user_namespace.h>\n$(cat drivers/kernelsu/ksu.c)" > drivers/kernelsu/ksu.c

          # Fix Hooks: Manually declare the variables that Xiaomi is missing
          # We add them to include/linux/fs.h to ensure they are visible globally
          echo -e "extern void *vfs_read_target;\nextern void *vfs_write_target;\nextern void *do_execve_target;\n$(cat include/linux/fs.h)" > include/linux/fs.h
          
          # Define and Export them in the filesystem core
          echo 'void *vfs_read_target = NULL; EXPORT_SYMBOL(vfs_read_target);' >> fs/read_write.c
          echo 'void *vfs_write_target = NULL; EXPORT_SYMBOL(vfs_write_target);' >> fs/read_write.c
          echo 'void *do_execve_target = NULL; EXPORT_SYMBOL(do_execve_target);' >> fs/exec.c

      - name: Build Kernel
        run: |
          TC_DIR=$(pwd)/toolchain/bin
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="Valeryn"
          export KBUILD_BUILD_HOST="Github-Actions"

          # Use your specific chime-stock_defconfig
          make O=out ARCH=arm64 vendor/chime-stock_defconfig
          
          # Full Build with Clang
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=$TC_DIR/clang \
                      LD=$TC_DIR/ld.lld \
                      AR=$TC_DIR/llvm-ar \
                      NM=$TC_DIR/llvm-nm \
                      OBJCOPY=$TC_DIR/llvm-objcopy \
                      OBJDUMP=$TC_DIR/llvm-objdump \
                      STRIP=$TC_DIR/llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      HOSTCC=gcc \
                      HOSTCXX=g++

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          [ -f out/arch/arm64/boot/Image.gz ] && cp out/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f out/arch/arm64/boot/Image ] && cp out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=chime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=citrus/' anykernel.sh
          zip -r ../ReSukiSU-Kernel-Chime.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-Chime
          path: ReSukiSU-Kernel-Chime.zip
