name: Build ReSukiSU Kernel (Android 16)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: android16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm-dev python3 python3-setuptools libncurses-dev

      - name: Set up Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Integrate ReSukiSU
        run: |
          # Automatically patches your source code to include ReSukiSU and KPM
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s nongki

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Customizing the build info (optional but looks cool in "About Phone")
          export KBUILD_BUILD_USER="Valeryn"
          export KBUILD_BUILD_HOST="Github-Actions"

          # Step 1: Generate the config
          make O=out vendor/chime-stock_defconfig
          
          # Step 2: Full build with LLVM tools
          make -j$(nproc --all) O=out \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          
          # Search for the output file
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cd AnyKernel3
          # Configure AnyKernel3 for Chime/Citrus
          sed -i 's/device.name1=.*/device.name1=chime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=citrus/' anykernel.sh
          zip -r ../ReSukiSU-Kernel-Chime.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-Chime
          path: ReSukiSU-Kernel-Chime.zip
