name: Build ReSukiSU Kernel (Android 16)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: android16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm-dev python3 python3-setuptools libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Set up Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain

      - name: Clean and Integrate ReSukiSU
        run: |
          # 1. Ensure a clean state
          git checkout -- .
          rm -rf drivers/kernelsu
          
          # 2. Clone ReSukiSU
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu --depth=1
          
          # 3. Move files and update build system
          # Check if kernel directory exists before moving
          if [ -d "drivers/kernelsu/kernel" ]; then
            mv drivers/kernelsu/kernel/* drivers/kernelsu/
          fi
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Global Hook Surgery (Fixes Redefinition & Visibility)
        run: |
          # 1. Create a dedicated header so all files see the same variables
          cat <<EOF > include/linux/ksu_hooks.h
          #ifndef _KSU_HOOKS_H
          #define _KSU_HOOKS_H
          #include <linux/types.h>
          extern void *vfs_read_target;
          extern void *vfs_write_target;
          extern void *do_execve_target;
          #endif
          EOF

          # 2. Inject this header into ReSukiSU files
          # NOTE: hooks.c might not exist in all forks. We inject into kpm.c and ksu.c to be safe.
          if [ -f "drivers/kernelsu/hooks.c" ]; then
            sed -i '1i #include <linux/ksu_hooks.h>' drivers/kernelsu/hooks.c
          fi
          
          # Inject into kpm.c (Kernel Patch Module - likely where hooks are)
          if [ -f "drivers/kernelsu/kpm.c" ]; then
             sed -i '1i #include <linux/ksu_hooks.h>' drivers/kernelsu/kpm.c
          fi

          # Inject into ksu.c (Core logic)
          if [ -f "drivers/kernelsu/ksu.c" ]; then
             sed -i '1i #include <linux/ksu_hooks.h>' drivers/kernelsu/ksu.c
          fi
          
          # 3. Define and Export variables in the core (Reset files first to prevent redefinition)
          git checkout -- fs/read_write.c fs/exec.c
          echo -e '\n#include <linux/ksu_hooks.h>\nvoid *vfs_read_target = NULL;\nEXPORT_SYMBOL(vfs_read_target);\nvoid *vfs_write_target = NULL;\nEXPORT_SYMBOL(vfs_write_target);' >> fs/read_write.c
          echo -e '\n#include <linux/ksu_hooks.h>\nvoid *do_execve_target = NULL;\nEXPORT_SYMBOL(do_execve_target);' >> fs/exec.c

          # 4. Fix KPROBE_HIT_ACTIVE specifically for 4.19
          # We use 'sed' to insert it AFTER the includes in kpm.c
          if [ -f "drivers/kernelsu/kpm.c" ]; then
            sed -i '/#include/a #ifndef KPROBE_HIT_ACTIVE\n#define KPROBE_HIT_ACTIVE 1\n#endif' drivers/kernelsu/kpm.c
          fi

          # 5. Fix Namespace error
          if [ -f "drivers/kernelsu/ksu.c" ]; then
            sed -i '1i #include <linux/user_namespace.h>' drivers/kernelsu/ksu.c
          fi

      - name: Build Kernel
        run: |
          TC_DIR=$(pwd)/toolchain/bin
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="Valeryn"
          export KBUILD_BUILD_HOST="Github-Actions"

          make O=out ARCH=arm64 vendor/chime-stock_defconfig
          
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=$TC_DIR/clang \
                      LD=$TC_DIR/ld.lld \
                      AR=$TC_DIR/llvm-ar \
                      NM=$TC_DIR/llvm-nm \
                      OBJCOPY=$TC_DIR/llvm-objcopy \
                      OBJDUMP=$TC_DIR/llvm-objdump \
                      STRIP=$TC_DIR/llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      HOSTCC=gcc \
                      HOSTCXX=g++

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          [ -f out/arch/arm64/boot/Image.gz ] && cp out/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f out/arch/arm64/boot/Image ] && cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=chime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=citrus/' anykernel.sh
          zip -r ../ReSukiSU-Kernel-Chime.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel
          path: ReSukiSU-Kernel-Chime.zip
