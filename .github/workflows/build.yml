name: Build ReSukiSU Kernel (Android 16)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: android16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm-dev python3 python3-setuptools libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Set up Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain

      - name: Manual ReSukiSU Integration
        run: |
          # 1. Clean and Clone
          rm -rf drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu --depth=1
          
          # 2. Move source files to driver root
          mv drivers/kernelsu/kernel/* drivers/kernelsu/
          
          # 3. Add to build system if missing
          grep -q "obj-y += kernelsu/" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu/Kconfig" drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Surgical Source Patching (Fixes Redefinition & Undeclared)
        run: |
          # 1. Fix include/linux/fs.h (The DECLARATIONS)
          # We use a guard to ensure we never add these more than once
          if ! grep -q "extern void *vfs_read_target;" include/linux/fs.h; then
            sed -i '1i #ifndef _RESUKISU_H_HOOKS\n#define _RESUKISU_H_HOOKS\nextern void *vfs_read_target;\nextern void *vfs_write_target;\nextern void *do_execve_target;\n#endif' include/linux/fs.h
          fi

          # 2. Fix fs/read_write.c and fs/exec.c (The DEFINITIONS)
          # We check if the symbol is already exported to prevent redefinition errors
          grep -q "EXPORT_SYMBOL(vfs_read_target);" fs/read_write.c || echo -e 'void *vfs_read_target = NULL;\nEXPORT_SYMBOL(vfs_read_target);\nvoid *vfs_write_target = NULL;\nEXPORT_SYMBOL(vfs_write_target);' >> fs/read_write.c
          grep -q "EXPORT_SYMBOL(do_execve_target);" fs/exec.c || echo -e 'void *do_execve_target = NULL;\nEXPORT_SYMBOL(do_execve_target);' >> fs/exec.c

          # 3. Fix KPROBE_HIT_ACTIVE for 4.19 kernels
          # We define it directly at the start of the failing file
          if ! grep -q "#define KPROBE_HIT_ACTIVE 1" drivers/kernelsu/kpm.c; then
            sed -i '1i #ifndef KPROBE_HIT_ACTIVE\n#define KPROBE_HIT_ACTIVE 1\n#endif' drivers/kernelsu/kpm.c
          fi

          # 4. Fix User Namespace inclusion
          if ! grep -q "user_namespace.h" drivers/kernelsu/ksu.c; then
            sed -i '1i #include <linux/user_namespace.h>' drivers/kernelsu/ksu.c
          fi

      - name: Build Kernel
        run: |
          TC_DIR=$(pwd)/toolchain/bin
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="Valeryn"
          export KBUILD_BUILD_HOST="Github-Actions"

          make O=out ARCH=arm64 vendor/chime-stock_defconfig
          
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=$TC_DIR/clang \
                      LD=$TC_DIR/ld.lld \
                      AR=$TC_DIR/llvm-ar \
                      NM=$TC_DIR/llvm-nm \
                      OBJCOPY=$TC_DIR/llvm-objcopy \
                      OBJDUMP=$TC_DIR/llvm-objdump \
                      STRIP=$TC_DIR/llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      HOSTCC=gcc \
                      HOSTCXX=g++

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          [ -f out/arch/arm64/boot/Image.gz ] && cp out/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f out/arch/arm64/boot/Image ] && cp out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=chime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=citrus/' anykernel.sh
          zip -r ../ReSukiSU-Kernel-Chime.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-Chime
          path: ReSukiSU-Kernel-Chime.zip
