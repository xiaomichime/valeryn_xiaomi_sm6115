name: Build Kernel with ReSukiSU + SUSFS (AnyKernel3)

on:
  workflow_dispatch:

env:
  KERNEL_NAME: Valeryn-KSU-SUSFS
  DEVICE_NAME: chime

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev libncurses5-dev \
            device-tree-compiler python3 python3-pip zip unzip git patch ccache \
            perl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi libfl-dev libmpc-dev libmpfr-dev libgmp-dev

      - name: Setup Proton Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/toolchains/clang
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$HOME/toolchains/clang" >> $GITHUB_ENV
          echo "LLVM=$HOME/toolchains/clang" >> $GITHUB_ENV

      - name: Integrate ReSukiSU
        run: |
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          if [ -d "drivers/kernelsu" ]; then
            echo "KernelSU already integrated, skipping symlink"
          else
            ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: Integrate SUSFS
        run: |
          # Clone SUSFS
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs || {
            wget https://gitlab.com/simonpunk/susfs4ksu/-/archive/main/susfs4ksu-main.zip
            unzip susfs4ksu-main.zip
            mv susfs4ksu-main susfs
          }
          
          # Smart Copy: Find and move files regardless of repo structure
          find susfs -name "susfs.h" -exec cp {} include/linux/ \;
          find susfs -name "susfs.c" -exec cp {} fs/ \;

          # Apply SUSFS Patches (Specifically for 4.19)
          FS_PATCH=$(find susfs -name "fs_susfs.patch" | grep "4.19" | head -1)
          SYS_PATCH=$(find susfs -name "non_gki_sysctl.patch" | grep "4.19" | head -1)
          KSU_PATCH=$(find susfs -name "*susfs.patch*" | grep "KernelSU" | head -1)

          [ -f "$FS_PATCH" ] && patch -p1 < "$FS_PATCH" || echo "FS patch not found or failed"
          [ -f "$SYS_PATCH" ] && patch -p1 < "$SYS_PATCH" || echo "Sysctl patch not found or failed"
          
          if [ -f "$KSU_PATCH" ]; then
            cd KernelSU
            patch -p1 < "../$KSU_PATCH" || echo "KSU SUSFS patch failed"
            cd ..
          fi

      - name: Fix Compilation Errors (Menu.c & RCU/BPF)
        run: |
          # 1. Fix 'no member named last_state_idx' in menu.c
          if [ -f "drivers/cpuidle/governors/menu.c" ]; then
            echo "Patching menu.c to fix missing member error..."
            sed -i 's/data->last_state_idx = idx;/\/\/ data->last_state_idx = idx;/g' drivers/cpuidle/governors/menu.c
            sed -i 's/return data->last_state_idx;/\/\/ return data->last_state_idx;\n\t\treturn 0;/g' drivers/cpuidle/governors/menu.c
          fi

          # 2. Fix RCU Kconfig
          if [ -f "kernel/rcu/Kconfig" ]; then
            sed -i 's/def_bool 0/def_bool y/' kernel/rcu/Kconfig
          fi

          # 3. Fix BPF sysctl
          if [ -f "kernel/sysctl.c" ] && grep -q "bpf_stats_enabled" kernel/sysctl.c; then
            perl -i -0pe 's/(\t\{\n\t\t\.procname\t= "bpf_stats_enabled",.*?\n\t\},)/#ifdef CONFIG_BPF_SYSCALL\n$1\n#endif/s' kernel/sysctl.c
          fi

      - name: Configure Kernel
        run: |
          # 1. Find the defconfig path relative to arch/arm64/configs/
          # We need to pass the EXACT path that 'make' expects (e.g., vendor/chime-stock_defconfig)
          
          if [ -f "arch/arm64/configs/vendor/chime-stock_defconfig" ]; then
            DEFCONFIG="vendor/chime-stock_defconfig"
          elif [ -f "arch/arm64/configs/chime-stock_defconfig" ]; then
            DEFCONFIG="chime-stock_defconfig"
          else
            echo "CRITICAL ERROR: Defconfig not found!"
            exit 1
          fi

          echo "Using defconfig: $DEFCONFIG"
          make ARCH=arm64 O=out $DEFCONFIG

          # 2. Disable IKCONFIG to prevent 'config_data.gz' build error
          # This fixes the "No rule to make target..." error
          ./scripts/config --file out/.config --disable IKCONFIG
          ./scripts/config --file out/.config --disable IKCONFIG_PROC

          # 3. Enable KernelSU and SUSFS
          cat >> out/.config << 'CONFIGEOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          CONFIG_SUSFS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS_SHOW_SPOOFED_PROCFS=y
          CONFIG_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPROBES=y
          # CONFIG_BPF is not set
          CONFIG_TASKS_TRACE_RCU=y
          CONFIGEOF

          make ARCH=arm64 O=out olddefconfig

      - name: Build Kernel
        run: |
          export PATH="$HOME/toolchains/clang/bin:$PATH"
          make -j$(nproc) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            2>&1 | tee build.log

      - name: Prepare DTB and DTBO
        run: |
          make ARCH=arm64 O=out dtbs -j$(nproc) CC=clang CROSS_COMPILE=aarch64-linux-gnu-
          
          DTB_PATH=$(find out/arch/arm64/boot/dts -name "*chime*.dtb" | head -1)
          if [ -f "$DTB_PATH" ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cat out/arch/arm64/boot/Image.gz "$DTB_PATH" > out/arch/arm64/boot/Image.gz-dtb
            echo "KERNEL_FILE=Image.gz-dtb" >> $GITHUB_ENV
          else
            echo "KERNEL_FILE=Image.gz" >> $GITHUB_ENV
          fi

          DTBO_FILES=$(find out/arch/arm64/boot/dts -name "*.dtbo")
          if [ -n "$DTBO_FILES" ]; then
            cat $DTBO_FILES > out/arch/arm64/boot/dtbo.img
          fi

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git patch ramdisk modules
          
          cp ../out/arch/arm64/boot/${{ env.KERNEL_FILE }} . || cp ../out/arch/arm64/boot/Image .
          [ -f "../out/arch/arm64/boot/dtbo.img" ] && cp ../out/arch/arm64/boot/dtbo.img .

          cat > anykernel.sh << 'ANYKERNELEOF'
          properties() { '
          kernel.string=Valeryn-KSU-SUSFS by ReSukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=chime
          device.name2=citrus
          device.name3=lime
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          if [ -f "$TMPDIR/dtbo.img" ]; then
            ui_print "Flashing DTBO...";
            dd if="$TMPDIR/dtbo.img" of=/dev/block/bootdevice/by-name/dtbo;
          fi
          ANYKERNELEOF

          zip -r9 ../${{ env.KERNEL_NAME }}-AnyKernel3.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-AnyKernel3
          path: ${{ env.KERNEL_NAME }}-AnyKernel3.zip
          retention-days: 7

      - name: Upload Build Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            out/.config
            build.log
